[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sof-question-extractor"
version = "0.1.0"
description = "Extract SOF-style multiple-choice questions from PNG files using local Ollama models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-ollama>=0.3.0",
  "langgraph>=0.4.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
sof-extract = "sof_extractor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sof_extractor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
